description: >
  Back up every day and drill once a week, each from its own schedule trigger
  (named daily-backup and weekly-drill in Project Settings > Triggers). The
  shared serial group keeps a drill from starting while a backup is still
  writing its snapshot.
usage:
  version: 2.1
  orbs:
    backupdrill: backupdrill/supabase-backup@1.0.0
  workflows:
    daily-backup:
      when:
        and:
          - equal: [scheduled_pipeline, << pipeline.trigger_source >>]
          - equal: [daily-backup, << pipeline.schedule.name >>]
      jobs:
        - backupdrill/backup:
            context: supabase-backup
            bucket: my-supabase-backups
            s3_region: us-east-1
            serial-group: << pipeline.project.slug >>/backupdrill
    weekly-drill:
      when:
        and:
          - equal: [scheduled_pipeline, << pipeline.trigger_source >>]
          - equal: [weekly-drill, << pipeline.schedule.name >>]
      jobs:
        - backupdrill/drill:
            context: supabase-backup
            bucket: my-supabase-backups
            s3_region: us-east-1
            serial-group: << pipeline.project.slug >>/backupdrill

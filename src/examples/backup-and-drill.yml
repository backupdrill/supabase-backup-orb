description: >
  Back up a Supabase project on a schedule and restore-drill the new snapshot
  right after. The BACKUPDRILL_* secrets live in a context named
  supabase-backup. Add a schedule trigger in Project Settings > Triggers to
  start the pipeline, for example daily at 03:00. To run it by hand, trigger a
  pipeline with the run-backupdrill parameter set to true.
usage:
  version: 2.1
  orbs:
    backupdrill: backupdrill/supabase-backup@1.0.0
  parameters:
    run-backupdrill:
      type: boolean
      default: false
  workflows:
    supabase-backup:
      when:
        or:
          - equal: [scheduled_pipeline, << pipeline.trigger_source >>]
          - << pipeline.parameters.run-backupdrill >>
      jobs:
        - backupdrill/backup:
            context: supabase-backup
            bucket: my-supabase-backups
            s3_endpoint: https://<account-id>.r2.cloudflarestorage.com
            serial-group: << pipeline.project.slug >>/backupdrill
        - backupdrill/drill:
            context: supabase-backup
            requires:
              - backupdrill/backup
            bucket: my-supabase-backups
            s3_endpoint: https://<account-id>.r2.cloudflarestorage.com

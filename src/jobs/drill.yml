description: >
  Restore the newest snapshot from your bucket into a throwaway Postgres on a
  Linux VM and check it. The drill verifies the archive checksum and samples checksums of the
  backed-up Storage files. The job fails if a checked checksum differs, a
  table listed in manifest.json is missing, or an ordinary table's restored
  row count differs from the count recorded in the backup. Needs only the
  bucket keys, not the database URL.

executor: << parameters.executor >>

parameters:
  executor:
    type: executor
    default: machine
    description: >
      Executor to run on. The default is this orb's machine executor. It has
      to be a machine executor: the drill connects to its throwaway Postgres
      over 127.0.0.1, which in a Docker executor job is the job container
      itself.
  cli_version:
    type: string
    default: "2.11.1"
    description: backupdrill npm version. Use 2.11.1 or a newer full version number, or latest.
  postgres_version:
    type: integer
    default: 17
    description: >
      PostgreSQL major version of the pg_restore to use. It cannot be lower
      than the pg_dump that made the backup.
  bucket:
    type: string
    default: ""
    description: Bucket name. Leave empty to use the BACKUPDRILL_S3_BUCKET variable.
  s3_endpoint:
    type: string
    default: ""
    description: >
      S3 endpoint for R2, B2 and other S3-compatible storage. Leave empty for
      AWS S3 or to use the BACKUPDRILL_S3_ENDPOINT variable.
  s3_region:
    type: string
    default: ""
    description: >
      Bucket region, such as us-east-1. Leave empty to use the
      BACKUPDRILL_S3_REGION variable, or auto when that isn't set either.
  project_name:
    type: string
    default: ""
    description: >
      Folder for this project's snapshots in the bucket. Leave empty to use the
      BACKUPDRILL_PROJECT_NAME variable, or supabase.
  no_output_timeout:
    type: string
    default: 30m
    description: >
      How long the step may go without printing anything before CircleCI stops
      it. A large pg_restore can stay quiet for a while.

steps:
  - install-postgres-client:
      postgres_version: << parameters.postgres_version >>
  - drill:
      cli_version: << parameters.cli_version >>
      postgres_version: << parameters.postgres_version >>
      bucket: << parameters.bucket >>
      s3_endpoint: << parameters.s3_endpoint >>
      s3_region: << parameters.s3_region >>
      project_name: << parameters.project_name >>
      no_output_timeout: << parameters.no_output_timeout >>

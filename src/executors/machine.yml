description: >
  Linux VM for the drill job. The drill starts a throwaway Postgres with
  `docker run -p 127.0.0.1:0:5432` and connects to it on 127.0.0.1, so Docker
  has to run on the same host as the job. With the Docker executor and
  setup_remote_docker the port opens on a remote host, where the job can't
  reach it.

parameters:
  image:
    type: string
    default: ubuntu-2404:current
    description: Linux machine image.
  resource_class:
    type: string
    default: medium
    description: >
      Machine resource class. The drill downloads the dump and restores it
      on this VM, so pick a larger class for big databases.

machine:
  image: << parameters.image >>

resource_class: << parameters.resource_class >>
